# Suppress PHP rules that conflict with WordPress Coding Standards (WPCS).
# PHPCS + WPCS runs in CI and is the authoritative linter for this directory.
#
# php:S1779 / php:S105 — tabs required by WPCS, Sonar wants spaces
# php:S100               — snake_case required by WPCS, Sonar wants camelCase
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1779
sonar.issue.ignore.multicriteria.e1.resourceKey=wordpress-plugin/**
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e2.resourceKey=wordpress-plugin/**
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S105
sonar.issue.ignore.multicriteria.e3.resourceKey=wordpress-plugin/**
