name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: PHP lint (WordPress plugin)
        run: |
          cd wordpress-plugin
          composer install --no-interaction
          composer lint

      - name: Pack
        run: npm pack

      - name: Pack WordPress plugin
        run: cd wordpress-plugin && zip -r ../local-to-pages-wordpress-plugin.zip local-to-pages/

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} *.tgz local-to-pages-wordpress-plugin.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes-start-tag "${{ steps.prev_tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
