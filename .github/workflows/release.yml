name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: PHP lint (WordPress plugin)
        run: |
          cd wordpress-plugin
          composer install --no-interaction
          composer lint

      - name: Pack
        run: npm pack

      - name: Pack WordPress plugin
        run: cd wordpress-plugin && zip -r ../local-to-pages-wordpress-plugin.zip local-to-pages/

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ github.ref_name }}" \
            -f previous_tag_name="${{ steps.prev_tag.outputs.tag }}" \
            --jq '.body')
          # Strip version bump PR lines (e.g. "* 0.1.21 by @..." or "* chore/bump...")
          FILTERED=$(echo "$NOTES" | grep -vE '^\* [0-9]+\.[0-9]+\.[0-9]+|^\* chore.?bump')
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILTERED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} *.tgz local-to-pages-wordpress-plugin.zip \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.notes.outputs.body }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
